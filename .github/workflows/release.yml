name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (macOS, universal)
        if: matrix.os == 'macos-latest'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -A x64

      - name: Build
        run: cmake --build build --config Release -j

      - name: Stage artefacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          cp -R build/TapeSweet_artefacts/Release/AU/TapeSweet.component         dist/
          cp -R build/TapeSweet_artefacts/Release/VST3/TapeSweet.vst3            dist/
          cp -R build/TapeSweet_artefacts/Release/Standalone/TapeSweet.app       dist/
          cd dist && zip -r ../TapeSweet-macos.zip .

      - name: Stage artefacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse build/TapeSweet_artefacts/Release/VST3/TapeSweet.vst3      dist/
          Copy-Item -Recurse build/TapeSweet_artefacts/Release/Standalone/TapeSweet.exe dist/
          Compress-Archive -Path dist/* -DestinationPath TapeSweet-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TapeSweet-${{ matrix.name }}
          path: TapeSweet-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
